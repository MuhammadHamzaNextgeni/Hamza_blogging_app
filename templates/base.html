<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Blogging Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Blog</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Safe Token Refresh -->
    <script>
        async function refreshAccessToken() {
            try {
                const res = await fetch("/api/token/refresh/", {
                    method: "POST",
                    credentials: "include" // sends cookies
                });

                if (!res.ok) {
                    console.warn("Token refresh skipped or failed:", res.status);
                    return;
                }

                const data = await res.json();
                console.log("Access token refreshed:", data.detail);
            } catch (err) {
                console.error("Network error during token refresh:", err);
            }
        }

        
        if (document.cookie.includes("refresh_token")) {
            refreshAccessToken();
        }
    </script>
</body>
</html>
