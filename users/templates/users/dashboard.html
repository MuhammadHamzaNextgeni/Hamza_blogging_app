{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded">
                <div class="card-body text-center p-5">
                    <h1 class="card-title display-5 mb-3">Welcome to the Blog Platform, <strong>{{ user.username }}</strong>!</h1>
                    <div class="d-flex justify-content-center">
                        <a href="{% url 'users:logout' %}" class="btn btn-sm btn-danger mt-3">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
