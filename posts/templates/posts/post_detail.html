{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>{{ post.title }}</h2>
    <p class="text-muted">By {{ post.author.username }} | {{ post.created_at|date:"M d, Y" }}</p>
    <hr>
    <p>{{ post.content }}</p>

    <a href="{% url 'posts:post-list' %}" class="btn btn-secondary mt-3">Back to All Posts</a>
</div>
{% endblock %}
